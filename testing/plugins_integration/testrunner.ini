[testrunner]
strict_markers = True
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::testrunner.TestrunnerWarning
    ignore:usefixtures.* without arguments has no effect:testrunner.TestrunnerWarning
    ignore:.*.fspath is deprecated and will be replaced by .*.path.*:testrunner.TestrunnerDeprecationWarning
    ignore:_testrunner.python.CallSpec2 has been renamed to CallSpec.:testrunner.TestrunnerRemovedIn10Warning
