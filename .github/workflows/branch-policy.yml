name: Branch policy

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  enforce-dev-to-main:
    name: Enforce dev -> main
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_REF" != "main" ]]; then
            echo "This policy only applies to pull requests targeting main."
            exit 0
          fi

          if [[ "$HEAD_REF" != "dev" ]]; then
            echo "::error::Pull requests targeting main must originate from the dev branch. Received: ${HEAD_REF} -> ${BASE_REF}."
            exit 1
          fi

          echo "Branch policy satisfied: dev -> main."
